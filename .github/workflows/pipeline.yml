name: Lab DevSecOps + AI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_TAG: meu-app-devops:${{ github.sha }}

jobs:
  build-scan-and-plan:
    name: Build, Trivy Scan & AI Review
    runs-on: ubuntu-latest

    permissions:
      contents: read
      models: read
      pull-requests: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Build da Imagem Docker
        run: docker build -t ${{ env.IMAGE_TAG }} .

      - name: Scan de Vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Gerar Plano Terraform
        working-directory: ./infra
        run: |
          terraform init
          terraform plan -no-color -out=tfplan.bin
          terraform show -no-color tfplan.bin > tfplan.txt

      - name: Revisão do Plano pela IA (GitHub Models)
        if: github.event_name == 'pull_request'
        working-directory: ./infra
        run: |
          PLAN_TEXT=$(cat tfplan.txt | head -c 10000)

          PAYLOAD=$(jq -n \
            --arg sys "Você é um Arquiteto DevSecOps Sênior. Analise este terraform plan de forma objetiva em 3 tópicos: 1) Segurança (portas expostas, privilégios); 2) Mudanças destrutivas; 3) Veredito (Aprovado ou Atenção)." \
            --arg usr "$PLAN_TEXT" \
            '{
              model: "gpt-4o",
              messages: [
                { role: "system", content: $sys },
                { role: "user", content: $usr }
              ],
              temperature: 0.2
            }')

          curl -s -X POST "https://models.inference.ai.azure.com/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -d "$PAYLOAD" | jq -r '.choices[0].message.content' > review.md

      - name: Comentar Parecer da IA no Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('./infra/review.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 🤖 Revisão Automatizada de Infraestrutura (IA)\n\n${body}`
            });